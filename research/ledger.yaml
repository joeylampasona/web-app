# The research ledger. Every question this project has put to real data, what
# was measured, and how it came out. Adding a study is adding an entry here;
# publish checks the file and the site renders it at /research.
#
# Rules for an entry (publish/ledger.py enforces the mechanical ones):
#   id        R and two or three digits, never reused.
#   date      the day the result was written into this repository.
#   verdict   held | refuted | refused | adopted | open
#   source    where in this repository the measurement is recorded. An entry
#             says only what that source says. Nothing from memory, nothing
#             from another site.
#   An open question also says what it is waiting for.

note: >
  The date on each entry is the day its result was written into the
  repository, which for the earliest ones is the day the repository's history
  begins. Every figure is from the source named under it.

entries:
  - id: R01
    date: 2026-09-20
    question: Does the free price plan serve the whole market's daily bars?
    measured: >
      The provider's grouped daily endpoint on the free plan, for a recent
      session and for dates further and further back.
    result: >
      Yes, with a limit of roughly two years. A recent session returns twelve
      thousand tickers; a date beyond the window is refused for that date and
      not for the endpoint. The cost fell on the multi-year screen, whose
      first live run returned 42 setups, every one still forming and none
      broken out.
    verdict: held
    source:
      - "DECISIONS.md: Answered: does free Basic serve grouped daily aggregates?"

  - id: R02
    date: 2026-09-20
    question: >
      Would a shorter window let the multi-year screen see breakouts inside
      two years of history?
    measured: >
      The same screen on live data with its lookback at 104 weeks and at 78.
    result: >
      At 104 weeks: 42 setups, all forming, no breakouts. At 78: 101 setups,
      28 forming, 2 fresh breakouts, 13 climbing, 58 played out. The detector
      was right and the window was wrong for the history.
    verdict: adopted
    source:
      - "DECISIONS.md: Answered: the multi-year screen"

  - id: R03
    date: 2026-09-20
    question: How far may a bull flag's pause wander and still be a pause?
    measured: >
      The bull flag screen across the market at several widths of pause, high
      to low.
    result: >
      Three per cent left two names on the whole market. Eight left sixteen
      and twelve left twenty-one, and the extra five were pauses as violent
      as the advance before them. Eight was kept: it sits under the smallest
      pole that qualifies.
    verdict: adopted
    source:
      - "patterns/params.py: the help text of max_channel_pct"

  - id: R04
    date: 2026-09-20
    question: Is a tenth of a second between requests slow enough for a quote host?
    measured: >
      The first intraday sweep of about a thousand names at a tenth of a
      second apart.
    result: >
      It answered for sixty names beginning with A, nothing from B to M, and
      recovered at N: an edge throttling a burst and then forgiving it. The
      pause went to three tenths, and a refusal is now counted apart from a
      company that has no quote.
    verdict: refuted
    source:
      - "catalysts/cboe.py: the comment on PAUSE"

  - id: R05
    date: 2026-11-11
    question: >
      Is comparing the closes either side of a split's listed date enough to
      find bars that were never adjusted?
    measured: >
      The first night the split check ran on the stored history, and a dry
      run of the corrected rule after it.
    result: >
      No. It adjusted 62 symbols and missed ITA, whose stored bars step a
      session before the listed date, because a night's bar is fetched after
      a split executing that morning has already been applied. Looking one
      session earlier found 92 more, none in the ranked universe.
    verdict: refuted
    source:
      - "DECISIONS.md: Stored bars are adjusted for splits (2026-11-10)"

  - id: R06
    date: 2026-11-21
    question: Can Cboe's delayed quotes still be had by asking for them plainly?
    measured: >
      A probe from the nightly's runner, with every name the pipeline gives
      itself and with a browser's.
    result: >
      No: 221 of 221 requests a run were refused. Only a request dressed as
      a browser arriving from Cboe's own site is answered. That works, and
      it is not done: the door was closed on purpose, in front of something
      Cboe sells.
    verdict: refused
    source:
      - "DECISIONS.md: Intraday quotes ask two sources (2026-11-21)"
      - "DECISIONS.md: Option chains come from the clearing house and Yahoo (2026-11-25)"

  - id: R07
    date: 2026-11-21
    question: Can one source price every name on a screen in a single sweep?
    measured: >
      Yahoo's quote endpoint from the runner, two hundred names a request,
      against one request a name.
    result: >
      400 of 400 answered in under half a second, where a request a name had
      taken six minutes. The sweep now covers every name on a screen and not
      the nearest four hundred.
    verdict: adopted
    source:
      - "DECISIONS.md: Intraday quotes ask two sources (2026-11-21)"

  - id: R08
    date: 2026-11-24
    question: Is every implied volatility a chain carries a market's opinion?
    measured: >
      The first night's High IV page built from Yahoo's chains alone.
    result: >
      No. Contracts nobody has quoted carry an implied volatility of about a
      thousandth of a per cent, and dividing by one put Avista at the top of
      the page, 45,313 times richer than its neighbours. A reading under five
      per cent is now no reading.
    verdict: refuted
    source:
      - "catalysts/iv.py: the comment in compute and MIN_PLAUSIBLE_IV"

  - id: R09
    date: 2026-11-25
    question: Is it the hour of the night that thins Yahoo's open interest?
    measured: >
      The same sixty names read at 22:39 and again at 02:30 New York, from
      the nightly's runner.
    result: >
      No. Yahoo's open interest was 16.5 million contracts both times,
      against the clearing house's 17.6 million. What thinned it on the
      night of the 24th, when gamma covered 225 companies against 461 three
      nights earlier, is not known.
    verdict: refuted
    source:
      - "DECISIONS.md: Option chains come from the clearing house and Yahoo (2026-11-25)"

  - id: R10
    date: 2026-11-25
    question: >
      Can the clearing house's open interest, joined to Yahoo's quotes, stand
      in for the option book Cboe no longer gives?
    measured: >
      Sixty names from the runner, then the first whole night on the join.
    result: >
      OCC's file answered for every company that has options, in about half
      a second each. 76% of Yahoo's contracts carried an implied volatility
      worth believing, 14% a quote too wide to be one. The first night gave
      415 full books and a gamma board of 502 names. It costs time: OCC
      answers three to four times slower at two in the morning, and the
      options stage took 37 minutes against 12.
    verdict: adopted
    source:
      - "DECISIONS.md: Option chains come from the clearing house and Yahoo (2026-11-25)"

  - id: R11
    date: 2026-11-26
    question: Is a second source's revenue the same count as the company's own release?
    measured: >
      Finnhub's reported revenue beside the revenue read out of the press
      release, on the first releases read.
    result: >
      Not always. Deere's release gives $12.1bn of net sales and revenues
      where Finnhub carries the $10.5bn of equipment sales analysts estimate,
      and Jacobs landed 81% over its estimate, gross against net. So a
      revenue within half and double the second source's is shown beside it
      and said to differ, and only one further off is withheld.
    verdict: refuted
    source:
      - "data/press_release.py: the docstring of checked"
      - "catalysts/finnhub.py: the comment on REVENUE_MISMATCH"

  - id: R12
    date: 2026-11-26
    question: Does a small model read a results press release as well as a larger one?
    measured: >
      Six real releases read side by side by the small model and the next
      one up, with the tokens the API counted for each.
    result: >
      Every figure was the same from both, and the revenues matched the
      second source's. A read cost a fifth of a cent against three cents.
      The first two had also been read by the largest model, with the same
      figures, at about six cents each. The small one reads them now.
    verdict: held
    source:
      - "data/press_release.py: the comment on MODEL"
      - "DECISIONS.md: What was added after the cross-check (2026-11-26)"

  - id: R13
    date: 2026-11-26
    question: Is there a free feed of trades by members of both chambers of Congress?
    measured: >
      Four candidates asked from the nightly's runner on the same day.
    result: >
      No. Finnhub's endpoint is a paid one, and the two community feeds that
      republished both chambers as JSON answered 403. The Senate publishes
      behind a click-through session with no file to fetch. Only the Clerk of
      the House answers, so senators are not covered and the page says so.
    verdict: refuted
    source:
      - "DECISIONS.md: Trades by members of the House, from the Clerk's own filings (2026-11-26)"

  - id: R14
    date: 2026-11-26
    question: Can the House Clerk's transaction reports be read as text, reliably?
    measured: >
      The sixty newest periodic transaction reports, each a PDF, read from
      the runner.
    result: >
      54 had text and 6 were paper filings scanned as images, which are
      counted and not read. 440 transactions, 387 of them stocks, 386 with a
      ticker. The form's cells come out run together, and one row in the
      sixty had its transaction cells in the middle of its asset's name;
      both are read.
    verdict: adopted
    source:
      - "DECISIONS.md: Trades by members of the House, from the Clerk's own filings (2026-11-26)"

  - id: R15
    date: 2026-11-26
    question: Does a breakout near the strike holding the most gamma behave differently?
    measured: >
      Nothing yet. It needs each breakout's distance from its peak-gamma
      strike on the day, beside what the breakout did next.
    result: >
      Not answered. The site says only that open interest concentrates gamma
      at a strike, and makes no claim about what price does there.
    verdict: open
    waiting_for: >
      History. Full option books have been kept only since the session of
      2026-11-25, and a screen needs twelve breakouts that have run twenty
      sessions before anything is said about it.
    source:
      - "DECISIONS.md: Option chains come from the clearing house and Yahoo (2026-11-25)"
      - "catalysts/gamma.py: the module's opening note"

  - id: R16
    date: 2026-11-26
    question: Do the screens drawn from a shape work?
    measured: >
      Nothing yet. The replay that rebuilds a screen's past breakouts can
      rebuild a base and cannot rebuild a trendline, so flags, wedges,
      triangles and the squeeze have no breakouts on record.
    result: >
      Not answered. On the record they are "too few to judge", with nothing
      counted.
    verdict: open
    waiting_for: >
      Either a replay that can refit a trendline as of a past date, or a
      forward record kept night by night from the breakouts the screens show.
    source:
      - "patterns/followthrough.py: the comment in compute"
      - "patterns/params.py: BASE_SCREEN_KEYS and SHAPE_SCREEN_KEYS"
