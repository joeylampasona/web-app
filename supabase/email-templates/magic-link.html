<!-- The Tape — sign-in code email.
     Pasted into Supabase: Authentication -> Emails -> Magic Link -> Message body.

     Supabase parses this with Go's html/template, which is strict: one
     unclosed quote or stray angle bracket and the send fails with a 500
     before SMTP is ever contacted. It looks exactly like a mail outage
     and is not one. Keep the markup boring, and change it here first.

     {{ .Token }} is the six-digit code. It is the only variable this
     template needs; there is deliberately no link, because a link cannot
     sign anyone into the iOS home-screen app (separate storage container)
     and a dead link in a sign-in email is worse than no link.

     Email clients ignore <style> blocks and CSS variables, so every colour
     is written inline as a literal. These match web/styles/tokens.css:
       surface-0 #0C0D12   surface-2 #1A1C25   border #24262F
       text-primary #FAF9F6   text-secondary #A8AAB8   text-muted #6E7180
       brand #F5A524
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0C0D12;margin:0;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;background-color:#12131A;border:1px solid #24262F;border-radius:14px;">
        <tr>
          <td style="padding:32px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#F5A524;font-weight:600;">The Tape</p>
            <h1 style="margin:14px 0 0 0;font-size:21px;line-height:1.3;font-weight:600;color:#FAF9F6;">Your sign-in code</h1>
            <p style="margin:10px 0 0 0;font-size:15px;line-height:1.55;color:#A8AAB8;">Enter this code in the app to finish signing in.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#1A1C25;border:1px solid #2E3039;border-radius:10px;">
              <tr>
                <td align="center" style="padding:20px 12px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:600;letter-spacing:0.22em;color:#FAF9F6;">{{ .Token }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 30px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:14px;line-height:1.55;color:#A8AAB8;">The code expires in one hour and works once.</p>
            <p style="margin:16px 0 0 0;font-size:13px;line-height:1.55;color:#6E7180;">If you didn't ask to sign in, you can ignore this email. Nobody can get into your account with this message alone.</p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#6E7180;">The Tape &middot; thetape.cc</p>
    </td>
  </tr>
</table>
