# Who reported today and how the price took it, to the earnings room.
#
# Twice a day. Before the open, the companies that report before the bell,
# with the price before the bell. In the evening, the ones that reported after
# the close, with the price after it. Each company is named once a day.
#
# The reaction is not the read. The read of the quarter is built from the
# 10-Q, which is filed days later at no particular hour. Each run here also
# asks SEC about the recent reporters still waiting on one and posts the read
# of any that has arrived, so it does not wait for the night.
name: Earnings reporters

on:
  schedule:
    # The command decides by the New York clock which run this is, and says
    # nothing outside its two windows, so one pair of UTC times serves both
    # halves of the year: 9:20 and 18:00 New York are 13:20 and 22:00 UTC in
    # summer, 14:20 and 23:00 in winter. GitHub delivers schedules late often
    # enough that a scheduled task also starts this job at both times.
    - cron: "20 13,14 * * 1-5"
    - cron: "0 22,23 * * 1-5"
  workflow_dispatch:
    inputs:
      when:
        description: "auto (by the New York clock), pre or post"
        required: false
        default: "auto"
      send:
        description: "Post it to Discord (false prints it only)"
        required: false
        default: "true"
      day:
        description: "YYYY-MM-DD, to try it against another day (leave empty for today)"
        required: false
        default: ""

concurrency:
  group: earnings-reporters
  cancel-in-progress: false

jobs:
  reporters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Fetch the published tree and the last run's note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git clone -q --depth 1 --branch data --single-branch "$repo" out
          rm -rf out/.git
          # Who has been named today. The job has no other memory.
          git clone -q --depth 1 --branch reporters --single-branch "$repo" last \
            || mkdir -p last
          rm -rf last/.git

      # The nightly's database, read-only, for the reads: which companies
      # have reported lately and what of theirs is already on file. Nothing
      # this job fetches is written back.
      - name: Restore the database
        uses: actions/cache/restore@v5
        with:
          path: var
          key: market-db-polygon-
          restore-keys: market-db-polygon-

      - name: Say who reported
        env:
          DATA_PROVIDER: polygon
          # The contact address SEC requires, for asking it about new filings.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          # The full screen lists, to say which of the reporters is on one.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_EARNINGS || secrets.DISCORD_WEBHOOK_URL }}
          # The morning run's before-the-bell post: names on a screen moving
          # in the pre-market, to the edition room. Discord only.
          DISCORD_WEBHOOK_EDITION: ${{ secrets.DISCORD_WEBHOOK_EDITION || secrets.DISCORD_WEBHOOK_URL }}
          # Optional. The day's reported figures, earnings and revenue
          # against their estimates. Without it the run reads Yahoo alone.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Optional. A first read of each named company's press release, by
          # a model, the evening it reports. Each read is a paid request;
          # without the key none is made.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://thetape.cc
          WHEN: ${{ inputs.when || 'auto' }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send == 'true' }}
          DAY: ${{ inputs.day }}
        run: |
          set -- --when "$WHEN" --state last/reporters.json --reads
          if [ -n "$DAY" ]; then set -- "$@" --day "$DAY"; fi
          if [ "$SEND" = "true" ]; then set -- "$@" --send; fi
          python -m cli reporters "$@"

      - name: Keep the note of who was named
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p send && cp out/reporters.json send/reporters.json
          cd send
          git init -q -b reporters
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Reporters $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            HEAD:refs/heads/reporters
