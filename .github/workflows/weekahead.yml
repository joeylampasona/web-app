# The week's earnings, to the earnings room on a Sunday evening.
#
# Which names on a screen report each day of the week to come, with the move
# the options price where that is known. It reads the published tree and the
# full screen lists, and writes nothing.
name: Week ahead

on:
  schedule:
    # Sunday 23:00 UTC: six in the evening in New York in winter, seven in
    # summer. One time, not two, so it posts once; an hour either way does not
    # matter to a post about the week.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      send:
        description: "Post it to Discord (false prints it only)"
        required: false
        default: "true"

jobs:
  weekahead:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Fetch the published tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --branch data --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" out
          rm -rf out/.git
      - name: Say who reports this week
        env:
          # The full screen lists, to say which of the reporters is on one.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_EARNINGS || secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://thetape.cc
          SEND: ${{ github.event_name == 'schedule' || inputs.send == 'true' }}
        run: |
          if [ "$SEND" = "true" ]; then
            python -m cli weekahead --send
          else
            python -m cli weekahead
          fi
