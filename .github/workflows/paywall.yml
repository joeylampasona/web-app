# Does the paywall actually withhold — and actually grant?
#
# Runs on every push and every night. It asks for gated content the way an
# outsider would (no token, a nonsense token, the public anon key) and fails if
# any of them comes back with content; then it signs in as a test account with
# a permanent subscription and fails if that account is refused, or if it can
# write.
#
# The second half is not symmetry for its own sake. Withholding alone is what a
# dropped table, a policy that denies everybody, and an unreachable project all
# look like from outside, and a check that only measures emptiness passes in
# every one of those cases. The subscriber half is what tells them apart.
#
# It exists because the gate already on this site shipped the data it was
# hiding: the page said "account needed" and the withheld numbers were in the
# same HTML. That was invisible for weeks and was found by measuring rather
# than by reading, so the measurement is the part worth keeping.
name: Paywall holds

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  withholds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --silent

      # The webhook signature is the only thing between "Stripe says this
      # person paid" and anyone who can POST to a public URL saying so. It is
      # written by hand, so it is tested by hand, against forgeries and
      # replays rather than only the happy path.
      - name: Webhook signatures reject forgeries
        working-directory: web
        run: node scripts/test-stripe-signature.mjs

      # Before trusting the check against the live project, check the check.
      # It runs against fake projects broken in known ways — leaking, denying
      # everyone, unreachable — and has to fail each one. No secrets and no
      # network: it talks to a socket on localhost.
      - name: The paywall check catches a broken paywall
        run: python tools/test_check_paywall.py

      # The nightly checks the tree it is about to push. This checks the tree
      # that is actually live, which is not the same claim: a hand-run publish,
      # a reverted commit, or a night that predates the check would all leave
      # gated content sitting on a public branch with nothing having failed.
      - name: Fetch the published data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: published

      - name: Nothing gated is on the public data branch
        run: python tools/check_public_data.py published

      - name: Ask for what should be refused, and for what should be granted
        env:
          # The first two are public by design: the anon key identifies the
          # project, not a person, and the point of the outsider half is that
          # holding it grants nothing. No service-role key appears here, and if
          # one ever does the check stops meaning anything.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # A test account holding a subscription that no card is behind, seeded
          # by supabase/paywall_selftest.sql. Without these the subscriber half
          # is skipped and the run says, in as many words, that it has only
          # proved half of it.
          PAYWALL_TEST_EMAIL: ${{ secrets.PAYWALL_TEST_EMAIL }}
          PAYWALL_TEST_PASSWORD: ${{ secrets.PAYWALL_TEST_PASSWORD }}
        run: python tools/check_paywall.py
