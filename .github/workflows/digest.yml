name: Weekly digest

# Sunday, on the data the nightly already published.
#
# The nightly runs Tuesday to Saturday, so nothing is competing for Sunday and
# the latest published session is Friday's close — which is the right input for
# a letter about the week ahead. Nothing here recomputes anything; it reads the
# same out/ tree the site serves.
#
# The letter is the same for every subscriber and contains nothing from anyone's
# account. That is why this job is short: there is no per-person data to get
# wrong, so the preview below is literally what everyone receives.
#
# The scheduled run SENDS. A manual run does not unless `send` is ticked, so
# a hand-started run is still a safe way to read the letters first: it
# composes them and uploads them as an artifact. `only` narrows either kind of
# run to one address, for a test send to yourself.
#
# A re-run is safe. Anyone reached in the last 72 hours is skipped, so a
# Sunday run that dies halfway can be started again without anyone getting
# the letter twice.
on:
  schedule:
    # 13:00 UTC Sunday — mid-morning in the US, early afternoon in Europe.
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      send:
        description: "Actually send. Off means compose and upload for review."
        type: boolean
        default: false
      only:
        # This one address does appear in the run's log, which is public.
        # Delete the run's logs afterwards if that matters.
        description: "One address, for a test send to yourself (shows in the public log)"
        type: string
        default: ""

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SITE_URL: https://thetape.cc
      DIGEST_FROM: "The Tape <noreply@thetape.cc>"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The published tree, exactly as the site serves it. The digest never
      # recomputes: if the letter and the site disagree, the letter is wrong.
      - name: Fetch the published data
        run: |
          git fetch origin data --depth=1
          git worktree add /tmp/published origin/data
          ls /tmp/published/meta.json

      - name: Refuse to run on stale data
        run: |
          as_of=$(python3 -c "import json;print(json.load(open('/tmp/published/meta.json'))['as_of'])")
          age=$(( ($(date -u +%s) - $(date -u -d "$as_of" +%s)) / 86400 ))
          echo "published session $as_of, $age day(s) old"
          # Friday's close read on Sunday is two days old. Four is the most it
          # can be without the nightly having failed, and a letter about "the
          # week ahead" built on last week's numbers is worse than no letter.
          if [ "$age" -gt 4 ]; then
            echo "::error::published data is $age days old — the nightly has not run. Not sending."
            exit 1
          fi

      - name: Compose (and send, if asked)
        run: |
          ARGS="--out /tmp/published"
          # A schedule has no inputs, so it is named outright rather than
          # read from `send`, which is empty on a scheduled run.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send }}" = "true" ]; then
            ARGS="$ARGS --send"
          fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          echo "python -m digest.send $ARGS"
          python -m digest.send $ARGS

      # Only a dry run produces these. A real send writes nothing to disk.
      - name: Upload the letters for review
        if: ${{ github.event_name != 'schedule' && inputs.send != true }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: var/digest-preview/
          if-no-files-found: ignore
          retention-days: 14
