name: Nightly scan

# 6:30pm ET on weekdays. GitHub cron is UTC only and does not follow US daylight
# saving, so both candidate hours are scheduled and the job checks the real
# Eastern hour before doing any work.
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it is not 6pm in New York"
        type: boolean
        default: true

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the first run backfills from scratch: ~2.5 hours
    permissions:
      contents: write
    env:
      # settings.local.yaml is gitignored, so CI states its own choices here.
      DATA_PROVIDER: polygon
      BACKFILL_DAYS: "900"
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Is it 6pm in New York?
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ inputs.force }}" = "true" ] || [ "$hour" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Eastern hour is $hour — this is the other cron slot. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Check this run will use real data
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "${POLYGON_API_KEY}" ]; then
            echo "POLYGON_API_KEY is not set. Add it under Settings ->"
            echo "Secrets and variables -> Actions. Refusing to publish a"
            echo "fixture to the data branch."
            exit 1
          fi
          python - <<'PY'
          from data import settings
          provider = settings.get("data.provider")
          print(f"provider: {provider}")
          if provider != "polygon":
              raise SystemExit(
                  f"data.provider resolved to {provider!r}, not 'polygon'. "
                  "A nightly run must not publish fixture data.")
          PY

      - name: Restore the database
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: var
          # Scoped by provider. An unscoped key let a fixture run's database be
          # restored into a live one, where the provenance check correctly
          # refused to mix one provider's prices with another's tickers.
          key: market-db-${{ env.DATA_PROVIDER }}-${{ github.run_id }}
          restore-keys: market-db-${{ env.DATA_PROVIDER }}-

      # Each stage is its own step so a failure names itself in the Discord post.
      - name: Fetch grouped daily and update the universe
        id: universe
        if: steps.gate.outputs.run == 'true'
        run: python -m cli universe --refresh

      - name: Rank
        id: rank
        if: steps.gate.outputs.run == 'true'
        run: python -m cli rank

      - name: Scan
        id: scan
        if: steps.gate.outputs.run == 'true'
        run: python -m cli scan

      - name: Catalysts and implied volatility
        id: catalysts
        if: steps.gate.outputs.run == 'true'
        run: python -m cli catalysts

      - name: Precompute default backtests and publish
        id: publish
        if: steps.gate.outputs.run == 'true'
        run: python -m cli publish

      - name: Check what was actually built before publishing it
        id: verify
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, pathlib, sys

          # The guard above checks intent, before any work. This checks the
          # artefact. The very first nightly run passed its settings check and
          # still pushed a fixture to the data branch, because the settings were
          # not what the pipeline ended up using. Whatever out/ actually says it
          # is, is what counts.
          meta = json.loads(pathlib.Path("out/meta.json").read_text())
          source = meta.get("data_source")
          print(f"data_source: {source}  provider: {meta.get('provider')}  "
                f"as_of: {meta.get('as_of')}  universe: {meta.get('universe_count')}")
          if source != "live":
              sys.exit(f"out/ was built from {source!r}, not live data. "
                       "Refusing to publish it to the data branch.")
          if not meta.get("schema_valid"):
              sys.exit("out/ did not validate against its own schema. "
                       "Refusing to publish it to the data branch.")

          # Provenance and schema were not enough. A run once published a tree
          # that was live, valid, and completely empty — SEC had refused every
          # share-count request, so no company had a market cap and the universe
          # filtered down to zero. Both checks passed it. Substance is a
          # separate question from provenance, so ask it separately.
          count = meta.get("universe_count") or 0
          if count < 500:
              sys.exit(f"universe_count is {count}. A liquid US universe is a "
                       "few thousand names; this few means a stage of the funnel "
                       "dropped almost everything. Refusing to publish it.")
          if not any(s.get("total") for s in meta.get("screens", [])):
              sys.exit("Every screen is empty. Refusing to publish it.")
          PY

      - name: Publish the data branch
        id: data
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A fresh repository inside out/ every night, force-pushed as a single
          # commit. The data branch never accumulates history, so a few megabytes
          # of JSON a night does not grow the repository forever.
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data for $(date -u +%F)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            HEAD:refs/heads/data
          echo "Pushed $(find . -name '*.json' | wc -l | tr -d ' ') files to the data branch."

      - name: Tell Vercel to rebuild
        # Pushing to the data branch does not trigger a deployment on its own,
        # so the site would serve last night's numbers forever. Inert until the
        # hook is set, so this does nothing before there is a site to refresh.
        if: steps.gate.outputs.run == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: |
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
            -o /dev/null -w 'Vercel deploy hook: HTTP %{http_code}\n'

      - name: Keep a copy as a run artefact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 14

      - name: Tell Discord how it went
        # Only worth a message when something moved. A night where nothing broke
        # out and nothing new formed is a normal night, and a bot that says so
        # every evening is a bot people mute.
        if: success() && steps.gate.outputs.run == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          meta = json.loads(pathlib.Path("out/meta.json").read_text())
          diff = {}
          path = pathlib.Path("out/breakouts/today.json")
          if path.exists():
              diff = json.loads(path.read_text())
          fresh = sum(s["stages"].get("fresh_breakout", 0) for s in meta["screens"])
          lines = [f"**{meta['as_of']}** — {meta['universe_count']:,} names scanned."]
          for screen in meta["screens"]:
              stages = screen["stages"]
              lines.append(
                  f"  {screen['name']}: {screen['total']} "
                  f"({stages.get('fresh_breakout', 0)} fresh, "
                  f"{stages.get('forming', 0)} forming)")
          if fresh == 0:
              lines.append("_Nothing broke out today. That is a reading, not a fault._")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({"content": "\n".join(lines)[:1900]}).encode(),
              headers={"Content-Type": "application/json"})
          urllib.request.urlopen(request, timeout=20)
          PY

      - name: Tell Discord it broke
        if: failure() && steps.gate.outputs.run == 'true' && env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          stage=unknown
          [ "${{ steps.universe.outcome }}"  = failure ] && stage=universe
          [ "${{ steps.rank.outcome }}"      = failure ] && stage=rank
          [ "${{ steps.scan.outcome }}"      = failure ] && stage=scan
          [ "${{ steps.catalysts.outcome }}" = failure ] && stage=catalysts
          [ "${{ steps.publish.outcome }}"   = failure ] && stage=publish
          [ "${{ steps.verify.outcome }}"    = failure ] && stage=verify-output
          [ "${{ steps.data.outcome }}"      = failure ] && stage=data-branch
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE="$stage" RUN_URL="$run_url" python - <<'PY'
          import json, os, urllib.request

          body = {"content": f"Nightly scan failed at stage **{os.environ['STAGE']}**.\n"
                             f"{os.environ['RUN_URL']}"}
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"})
          urllib.request.urlopen(request, timeout=20)
          PY

# Deployment is deliberately not scheduled here.
