name: Nightly scan

# When the data exists, not when the market shuts.
#
# The schedule used to be 6:30pm Eastern, half an hour after the close, which
# reads like the obvious time and cannot work. Our provider does not publish a
# session's grouped aggregates that evening:
#
#   run #13  Tue 00:34 ET  ->  published Mon 14th   Monday's close was there
#   run #14  Tue 20:04 ET  ->  published Mon 14th   Tuesday's close was not
#
# A run at half past six would therefore never carry that day's close, and the
# site would sit a session behind for ever without anything being broken. The
# window is now the small hours, by which time the previous session has landed —
# the gate targets the last completed session, so a run at 1:30am Wednesday is
# asking for Tuesday, which is what we want.
#
# Four slots rather than one because GitHub does not promise to run any of them:
# on 2026-09-14 it delivered both of the old slots over two hours late, and on
# 2026-09-15 it delivered neither, with the workflow active and the crons
# correct. Whichever fires first does the work; the rest read the data branch,
# see the session already published, and stand down in about five seconds.
# Redundancy is cheap once the gate is idempotent, and it is.
on:
  schedule:
    # 01:30 to 04:30 in New York. These are Tuesday-to-Saturday in UTC because
    # the Eastern day is the one before — Saturday UTC covers Friday's session.
    - cron: "30 5 * * 2-6"
    - cron: "30 6 * * 2-6"
    - cron: "30 7 * * 2-6"
    - cron: "30 8 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the last completed session is already published"
        type: boolean
        default: true

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the first run backfills from scratch: ~2.5 hours
    permissions:
      contents: write
    env:
      # settings.local.yaml is gitignored, so CI states its own choices here.
      DATA_PROVIDER: polygon
      BACKFILL_DAYS: "900"
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
      # Read-only, scoped to the Market Desk repository. Absent, the desk is
      # skipped and the site runs on its own data exactly as before.
      MARKET_DESK_TOKEN: ${{ secrets.MARKET_DESK_TOKEN }}
      # Scheduled economic data releases. Absent, the calendar carries company
      # events only and says so on the page.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Has tonight's session been scanned yet?
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The question is "has the last completed session been published yet",
          # not "is it the right time". It used to insist the Eastern hour be
          # exactly 18, which assumed a scheduled run starts when it is
          # scheduled; on 2026-09-14 both slots arrived over two hours late, the
          # hour was 20 and then 21, every step was skipped, and the run reported
          # success with a whole session unscanned.
          #
          # The session we ought to be holding: the most recent weekday whose
          # New York close has been and gone. Asking "is it today?" broke as
          # soon as a slot landed after midnight Eastern — the date rolled over,
          # the hour was 1, and the gate refused to catch up on a session that
          # was hours settled. This is the same question the backfill asks.
          session=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%-H)
          [ "$hour" -lt 18 ] && session=$(date -d "$session -1 day" +%F)
          while [ "$(date -d "$session" +%u)" -gt 5 ]; do
            session=$(date -d "$session -1 day" +%F)
          done
          echo "session=$session" >> "$GITHUB_OUTPUT"
          echo "New York time $hour:00; the last completed session is $session."

          decide() {  # run, skip-kind, reason
            echo "run=$1"    >> "$GITHUB_OUTPUT"
            echo "skip=$2"   >> "$GITHUB_OUTPUT"
            echo "reason=$3" >> "$GITHUB_OUTPUT"
            echo "$3" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${{ inputs.force }}" = "true" ]; then
            decide true none "Running because it was asked for by hand."
          else
            # Read the session out of the published data, not out of the commit
            # message describing it. The message was written by a previous run's
            # clock and can disagree with the tree it sits on — one already does:
            # a manual run at 1:30am Eastern labelled a tree "Data for
            # 2026-09-15" whose as_of was 2026-09-14, and this gate would have
            # read that label and skipped Tuesday on the strength of it.
            #
            # meta.json cannot disagree with itself. A label is a claim about
            # the work; as_of is the work.
            meta=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/meta.json?ref=data" \
              || echo "")
            published=$(printf '%s' "$meta" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("as_of",""))' \
              2>/dev/null || echo "")
            # How long ago the branch was last written. A market holiday has no
            # new session to publish, so as_of can never catch up to it and every
            # slot would run a full hour to rebuild the same tree. If the branch
            # was written in the last few hours, the work has been attempted and
            # there is nothing another attempt can add.
            age=$(printf '%s' "$meta" | python3 -c 'import datetime as d,json,sys;w=d.datetime.fromisoformat(json.load(sys.stdin)["generated_at"]);w=w if w.tzinfo else w.replace(tzinfo=d.timezone.utc);print(int((d.datetime.now(d.timezone.utc)-w).total_seconds()//3600))' 2>/dev/null || echo 99999)
            echo "The data branch holds the ${published:-<unknown>} session, written ${age}h ago."
            if [ "$published" = "$session" ]; then
              decide false expected "Skipped: the $session session is already published."
            elif [ "$age" -lt 4 ]; then
              decide false expected \
                "Skipped: the data branch was rebuilt ${age}h ago and is still on $published. A market holiday looks like this."
            else
              decide true none "Running: it is $hour:00 in New York on $session and that session is not published yet."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Check this run will use real data
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "${POLYGON_API_KEY}" ]; then
            echo "POLYGON_API_KEY is not set. Add it under Settings ->"
            echo "Secrets and variables -> Actions. Refusing to publish a"
            echo "fixture to the data branch."
            exit 1
          fi
          python - <<'PY'
          from data import settings
          provider = settings.get("data.provider")
          print(f"provider: {provider}")
          if provider != "polygon":
              raise SystemExit(
                  f"data.provider resolved to {provider!r}, not 'polygon'. "
                  "A nightly run must not publish fixture data.")
          PY

      - name: Say which optional sources are switched on
        if: steps.gate.outputs.run == 'true'
        run: |
          # Each of these adds a section to the site and none is required. A
          # missing section should be explained here rather than looking like a
          # fault on the page.
          on_off() { [ -n "$1" ] && echo "on" || echo "off — that section will be empty"; }
          echo "Market Desk signals: $(on_off "$MARKET_DESK_TOKEN")"
          echo "Data releases (FRED): $(on_off "$FRED_API_KEY")"
          echo "Discord report:      $(on_off "$DISCORD_WEBHOOK_URL")"
          echo "Vercel refresh:      $(on_off "$VERCEL_DEPLOY_HOOK")"

      - name: Restore the database
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: var
          # Scoped by provider. An unscoped key let a fixture run's database be
          # restored into a live one, where the provenance check correctly
          # refused to mix one provider's prices with another's tickers.
          key: market-db-${{ env.DATA_PROVIDER }}-${{ github.run_id }}
          restore-keys: market-db-${{ env.DATA_PROVIDER }}-

      # Each stage is its own step so a failure names itself in the Discord post.
      - name: Fetch grouped daily and update the universe
        id: universe
        if: steps.gate.outputs.run == 'true'
        run: python -m cli universe --refresh

      - name: Rank
        id: rank
        if: steps.gate.outputs.run == 'true'
        run: python -m cli rank

      - name: Scan
        id: scan
        if: steps.gate.outputs.run == 'true'
        run: python -m cli scan

      - name: Catalysts and implied volatility
        id: catalysts
        if: steps.gate.outputs.run == 'true'
        run: python -m cli catalysts

      - name: Precompute default backtests and publish
        id: publish
        if: steps.gate.outputs.run == 'true'
        run: python -m cli publish

      - name: Check what was actually built before publishing it
        id: verify
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          # The guard above checks intent, before any work. This checks the
          # artefact. The very first nightly run passed its settings check and
          # still pushed a fixture to the data branch, because the settings were
          # not what the pipeline ended up using. Whatever out/ actually says it
          # is, is what counts.
          meta = json.loads(pathlib.Path("out/meta.json").read_text())
          source = meta.get("data_source")
          print(f"data_source: {source}  provider: {meta.get('provider')}  "
                f"as_of: {meta.get('as_of')}  universe: {meta.get('universe_count')}")
          if source != "live":
              sys.exit(f"out/ was built from {source!r}, not live data. "
                       "Refusing to publish it to the data branch.")
          if not meta.get("schema_valid"):
              sys.exit("out/ did not validate against its own schema. "
                       "Refusing to publish it to the data branch.")

          # Provenance and schema were not enough. A run once published a tree
          # that was live, valid, and completely empty — SEC had refused every
          # share-count request, so no company had a market cap and the universe
          # filtered down to zero. Both checks passed it. Substance is a
          # separate question from provenance, so ask it separately.
          count = meta.get("universe_count") or 0
          if count < 500:
              sys.exit(f"universe_count is {count}. A liquid US universe is a "
                       "few thousand names; this few means a stage of the funnel "
                       "dropped almost everything. Refusing to publish it.")
          if not any(s.get("total") for s in meta.get("screens", [])):
              sys.exit("Every screen is empty. Refusing to publish it.")
          # Provenance, schema and substance all passed on a tree whose as_of had
          # not moved for three sessions — the backfill had marked sessions
          # fetched that it never asked for, so the run rebuilt Friday's data
          # perfectly every night. Nothing compared what was built against what
          # should have been built, so nothing noticed.
          import datetime as dt
          from zoneinfo import ZoneInfo

          eastern = dt.datetime.now(ZoneInfo("America/New_York"))
          expected = eastern.date()
          if eastern.hour < 18:
              expected -= dt.timedelta(days=1)
          while expected.weekday() >= 5:
              expected -= dt.timedelta(days=1)

          as_of = dt.date.fromisoformat(meta["as_of"])
          behind = (expected - as_of).days
          print(f"last completed New York session: {expected}  published: {as_of}  "
                f"({behind} days behind)")
          if behind > 3:
              # Three is the longest the US market ever closes: a Monday holiday
              # leaves Friday as the last session. Four cannot be a closed
              # market, so it is a scan rebuilding old data.
              sys.exit(f"out/ holds the {as_of} session but the last completed "
                       f"session was {expected}. The scan rebuilt old data. "
                       "Refusing to publish it as though it were tonight's.")
          if behind > 0:
              # A Monday holiday also lands here, so this cannot be a failure —
              # but it is never silent, because three nights of this in a row is
              # exactly what went unnoticed before.
              print(f"::warning::Published session is {as_of}, {behind} day(s) "
                    f"behind {expected}. A market holiday looks like this; so "
                    f"does a scan that is not advancing.")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"PUBLISHED_SESSION={as_of}\n")
              fh.write(f"SESSIONS_BEHIND={behind}\n")

          PY

      - name: Publish the data branch
        id: data
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A fresh repository inside out/ every night, force-pushed as a single
          # commit. The data branch never accumulates history, so a few megabytes
          # of JSON a night does not grow the repository forever.
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Load-bearing: the gate reads this line to decide whether tonight's
          # session has already been scanned, so it has to name the session this
          # tree HOLDS, which is meta.json's as_of. It named the wall-clock
          # session instead, and the two are not the same thing: a run started by
          # hand at 1:30am Eastern stamped "Data for 2026-09-15" on a tree whose
          # as_of was 2026-09-14, because Tuesday had not traded yet. The next
          # scheduled run would have read that label, believed Tuesday was
          # already scanned, and stood down — skipping a session on the strength
          # of a label for work that was never done.
          #
          # Which is the fault this gate exists to prevent, reintroduced by the
          # gate. The clock does not decide which session the data is; the data
          # does.
          session=$(python3 -c "import json; print(json.load(open('meta.json'))['as_of'])")
          echo "Publishing the $session session."
          git commit -q -m "Data for $session"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            HEAD:refs/heads/data
          echo "Pushed $(find . -name '*.json' | wc -l | tr -d ' ') files to the data branch."

      - name: Tell Vercel to rebuild
        # Pushing to the data branch does not trigger a deployment on its own,
        # so the site would serve last night's numbers forever. Inert until the
        # hook is set, so this does nothing before there is a site to refresh.
        if: steps.gate.outputs.run == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: |
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
            -o /dev/null -w 'Vercel deploy hook: HTTP %{http_code}\n'

      - name: Keep a copy as a run artefact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 14

      - name: Tell Discord how it went
        # A notification that will not send is not a failed scan. This run did
        # the whole job — universe, ranks, screens, filings, publish, deploy —
        # and then reported Failure because a chat message got a 403, which
        # also tripped the "it broke" step below into firing about itself.
        continue-on-error: true
        # Only worth a message when something moved. A night where nothing broke
        # out and nothing new formed is a normal night, and a bot that says so
        # every evening is a bot people mute.
        if: success() && steps.gate.outputs.run == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          meta = json.loads(pathlib.Path("out/meta.json").read_text())
          diff = {}
          path = pathlib.Path("out/breakouts/today.json")
          if path.exists():
              diff = json.loads(path.read_text())
          fresh = sum(s["stages"].get("fresh_breakout", 0) for s in meta["screens"])
          behind = int(os.environ.get("SESSIONS_BEHIND") or 0)
          # The session date was always in this message, but as a date you had to
          # remember last night's to interpret. Now it says so itself.
          stale = (f"  ⚠️ {behind} day(s) behind the last completed session — "
                   f"a market holiday looks like this, so does a stuck scan."
                   if behind else "")
          lines = [f"**{meta['as_of']}** — {meta['universe_count']:,} names scanned.{stale}"]
          for screen in meta["screens"]:
              stages = screen["stages"]
              lines.append(
                  f"  {screen['name']}: {screen['total']} "
                  f"({stages.get('fresh_breakout', 0)} fresh, "
                  f"{stages.get('forming', 0)} forming)")
          if fresh == 0:
              lines.append("_Nothing broke out today. That is a reading, not a fault._")
          # The hand-kept FOMC list, if it is running out. This is the message
          # somebody actually reads every day, so it is where the alarm belongs.
          # Heavily traded names that fell out of the universe for want of a
          # share count. Meta, Alphabet and Berkshire all vanished this way and
          # the only trace was a stage count dropping by four out of two
          # thousand. This is the message somebody actually reads.
          lost = meta.get("lost_leaders") or []
          if lost:
              lines.append(f"\n⚠️ Dropped for want of a share count, despite "
                           f"being among the most traded names: {', '.join(lost)}")
          fomc = meta.get("fomc") or {}
          if fomc.get("stale"):
              lines.append(f"\n⚠️ {fomc.get('message', 'The FOMC list needs attention.')}")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({"content": "\n".join(lines)[:1900]}).encode(),
              # Discord's edge rejects the default Python-urllib agent with a
              # 403. Naming ourselves is what it wants.
              headers={"Content-Type": "application/json",
                       "User-Agent": "base-and-breakout-nightly/1.0"})
          urllib.request.urlopen(request, timeout=20)
          PY

      - name: Tell Discord the session was missed
        continue-on-error: true
        if: steps.gate.outputs.skip == 'unexpected' && env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.gate.outputs.reason }}" RUN_URL="$run_url" python - <<'PY'
          import json, os, urllib.request
          body = {"content": f"Nightly scan did not run. {os.environ['REASON']}\n"
                             f"The site is still serving the previous session's data.\n"
                             f"{os.environ['RUN_URL']}"}
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "base-and-breakout-nightly/1.0"})
          urllib.request.urlopen(request, timeout=20)
          PY

      - name: Tell Discord it broke
        continue-on-error: true
        if: failure() && steps.gate.outputs.run == 'true' && env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          stage=unknown
          [ "${{ steps.universe.outcome }}"  = failure ] && stage=universe
          [ "${{ steps.rank.outcome }}"      = failure ] && stage=rank
          [ "${{ steps.scan.outcome }}"      = failure ] && stage=scan
          [ "${{ steps.catalysts.outcome }}" = failure ] && stage=catalysts
          [ "${{ steps.publish.outcome }}"   = failure ] && stage=publish
          [ "${{ steps.verify.outcome }}"    = failure ] && stage=verify-output
          [ "${{ steps.data.outcome }}"      = failure ] && stage=data-branch
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE="$stage" RUN_URL="$run_url" python - <<'PY'
          import json, os, urllib.request

          body = {"content": f"Nightly scan failed at stage **{os.environ['STAGE']}**.\n"
                             f"{os.environ['RUN_URL']}"}
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "base-and-breakout-nightly/1.0"})
          urllib.request.urlopen(request, timeout=20)
          PY

# Deployment is deliberately not scheduled here.
