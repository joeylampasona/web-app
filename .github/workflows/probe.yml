# A read-only diagnostic, run by hand.
#
# Two sections of the site are empty for reasons that cannot be reproduced on
# a development machine, because the sources involved are not reachable from
# one. This workflow runs the probe where the nightly runs and prints what the
# sources actually return, so the fix is written against evidence rather than
# against a guess about an API's shape.
#
# It writes nothing: no database, no data branch, no deploy.
name: Probe data sources

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sections to run, comma separated (shares, open_interest, flags, quotes, universe, splits, cboe). Empty runs all."
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Read-only. The flag sweep needs real prices, and this is where they
      # are; nothing here writes the cache back.
      - name: Restore the database
        uses: actions/cache/restore@v5
        with:
          path: var
          key: market-db-polygon-
          restore-keys: market-db-polygon-
      - name: Ask the sources what they return
        if: ${{ !startsWith(inputs.only, 'discord') }}
        env:
          # The contact address SEC requires. The probe never prints it.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          # For the universe trace's reference lookups. Never printed.
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PROBE_ONLY: ${{ inputs.only }}
        run: python tools/probe_sources.py


      # The one part of this workflow that is not read-only, and it runs only
      # when asked for by name: `only: discord`, or `only: discord-extras` for
      # just the posts that follow the edition. It posts a one-line test to
      # each Discord room, then this week's wrap and the last edition, from the
      # published tree,
      # so the rooms can be seen working without waiting for a nightly.
      - name: Try the Discord rooms
        if: ${{ startsWith(inputs.only, 'discord') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_EDITION: ${{ secrets.DISCORD_WEBHOOK_EDITION }}
          DISCORD_WEBHOOK_STOP_PRESS: ${{ secrets.DISCORD_WEBHOOK_STOP_PRESS }}
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          DISCORD_WEBHOOK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_EARNINGS }}
          SITE_URL: https://thetape.cc
          ONLY: ${{ inputs.only }}
        run: |
          git clone -q --depth 1 --branch data --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" out
          rm -rf out/.git
          if [ "$ONLY" = "discord-extras" ]; then
            # Only what follows the edition, and the room it added.
            python -m cli rooms --send --room earnings
            python -m cli edition --send --extras-only
          else
            python -m cli rooms --send
            python -m cli wrap --send
            # Last, because it waits for the site to be able to draw the card.
            python -m cli edition --send
          fi
